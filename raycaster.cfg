# Raycaster settings. One "name = value" per line, '#' starts a comment.
# Delete this file to get the defaults back.

scale = 1               # framebuffer 320x200 (1) or 640x400 (2)
window_width = 960      # ignored when fullscreen
window_height = 720     # ignored when fullscreen
fullscreen = no         # borderless, at the desktop resolution
vsync = yes             # frame rate is capped at 60 either way
fov = 70                # horizontal field of view, 50 - 110 degrees
sfx_volume = 1          # 0 - 1
music_volume = 1        # 0 - 1
music = yes             # MIDI music on or off

# Keys: up to two per action. Names: A-Z, 0-9, F1-F12, KP0-KP9, SPACE, COMMA, PERIOD,
# SLASH, SEMICOLON, APOSTROPHE, MINUS, EQUAL, LBRACKET, RBRACKET, BACKSLASH, GRAVE,
# ENTER, TAB, BACKSPACE, INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN,
# UP, DOWN, LEFT, RIGHT, LSHIFT, RSHIFT, LCTRL, RCTRL, LALT, RALT. Esc always quits.
key_forward = W UP
key_back = S DOWN
key_strafe_left = A
key_strafe_right = D
key_turn_left = COMMA
key_turn_right = PERIOD
key_run = LSHIFT RSHIFT
key_use = SPACE
key_fire = LCTRL RCTRL
key_stats = F1
